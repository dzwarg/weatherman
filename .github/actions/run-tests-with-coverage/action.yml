name: 'Run Tests with Coverage'
description: 'Execute tests with coverage reporting and upload results as artifacts'
author: 'Weatherman Team'

inputs:
  workspace:
    description: 'npm workspace to test (e.g., packages/frontend)'
    required: true
  package-name:
    description: 'Package name for artifact (e.g., frontend, backend)'
    required: true
  test-command:
    description: 'Test command to run (default: npm test --workspace=<workspace> -- --run)'
    required: false
    default: ''
  coverage-path:
    description: 'Path to coverage output directory (default: <workspace>/coverage)'
    required: false
    default: ''
  upload-coverage:
    description: 'Whether to upload coverage artifacts'
    required: false
    default: 'true'
  artifact-retention-days:
    description: 'Number of days to retain coverage artifacts'
    required: false
    default: '90'

outputs:
  coverage-lines:
    description: 'Line coverage percentage'
    value: ${{ steps.extract-coverage.outputs.lines }}
  coverage-statements:
    description: 'Statement coverage percentage'
    value: ${{ steps.extract-coverage.outputs.statements }}
  coverage-functions:
    description: 'Function coverage percentage'
    value: ${{ steps.extract-coverage.outputs.functions }}
  coverage-branches:
    description: 'Branch coverage percentage'
    value: ${{ steps.extract-coverage.outputs.branches }}

runs:
  using: 'composite'
  steps:
    - name: Run tests with coverage
      shell: bash
      run: |
        WORKSPACE="${{ inputs.workspace }}"
        CUSTOM_CMD="${{ inputs.test-command }}"
        echo "🧪 Running tests for ${{ inputs.package-name }}..."
        if [ -n "$CUSTOM_CMD" ]; then
          $CUSTOM_CMD
        else
          npm test --workspace="$WORKSPACE" -- --run
        fi
        echo "✅ Tests completed"

    - name: Extract coverage metrics
      id: extract-coverage
      if: always()
      shell: bash
      run: |
        WORKSPACE="${{ inputs.workspace }}"
        RAW_PATH="${{ inputs.coverage-path }}"
        COVERAGE_PATH="${RAW_PATH:-$WORKSPACE/coverage}"
        export COVERAGE_FILE="$COVERAGE_PATH/coverage-summary.json"
        echo "coverage_path=$COVERAGE_PATH" >> $GITHUB_OUTPUT
        node <<'EOF'
        const fs = require('fs');
        const coverageFile = process.env.COVERAGE_FILE;
        if (!fs.existsSync(coverageFile)) {
          console.warn('⚠️  Coverage file not found: ' + coverageFile);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'lines=0\nstatements=0\nfunctions=0\nbranches=0\n');
          process.exit(0);
        }
        const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
        const total = coverage.total;
        console.log('Lines: ' + total.lines.pct + '%');
        console.log('Statements: ' + total.statements.pct + '%');
        console.log('Functions: ' + total.functions.pct + '%');
        console.log('Branches: ' + total.branches.pct + '%');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'lines=' + total.lines.pct + '\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'statements=' + total.statements.pct + '\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'functions=' + total.functions.pct + '\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'branches=' + total.branches.pct + '\n');
        EOF

    - name: Upload coverage artifacts
      if: always() && inputs.upload-coverage == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.package-name }}-coverage-${{ github.run_number }}
        path: ${{ steps.extract-coverage.outputs.coverage_path }}
        retention-days: ${{ inputs.artifact-retention-days }}

branding:
  icon: 'check-circle'
  color: 'blue'
