name: 'Setup Node.js Environment'
description: 'Checkout code, setup Node.js with npm cache, and install dependencies'
author: 'Weatherman Team'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  skip-install:
    description: 'Skip npm ci step (useful if dependencies already installed)'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory for npm install'
    required: false
    default: '.'

outputs:
  node-version:
    description: 'Actual Node.js version installed'
    value: ${{ steps.setup.outputs.node-version }}
  cache-hit:
    description: 'Whether npm cache was hit'
    value: ${{ steps.setup.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js with npm cache
      id: setup
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'

    - name: Install dependencies
      if: inputs.skip-install != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "📦 Installing dependencies with npm ci..."
        npm ci
        echo "✅ Dependencies installed"

branding:
  icon: 'package'
  color: 'green'
