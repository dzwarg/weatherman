name: 'Check Coverage Threshold'
description: 'Verify code coverage meets minimum threshold requirements'
author: 'Weatherman Team'

inputs:
  coverage-file:
    description: 'Path to coverage-summary.json file'
    required: true
  threshold:
    description: 'Minimum coverage threshold percentage (0-100)'
    required: false
    default: '80'
  package-name:
    description: 'Package name for error messages (e.g., frontend, backend)'
    required: false
    default: 'package'
  check-lines:
    description: 'Check line coverage threshold'
    required: false
    default: 'true'
  check-statements:
    description: 'Check statement coverage threshold'
    required: false
    default: 'true'
  check-functions:
    description: 'Check function coverage threshold'
    required: false
    default: 'true'
  check-branches:
    description: 'Check branch coverage threshold'
    required: false
    default: 'true'
  fail-on-threshold:
    description: 'Fail the action if threshold not met'
    required: false
    default: 'true'

outputs:
  passed:
    description: 'Whether coverage meets all thresholds (true/false)'
    value: ${{ steps.check.outputs.passed }}
  lines-coverage:
    description: 'Line coverage percentage'
    value: ${{ steps.check.outputs.lines }}
  statements-coverage:
    description: 'Statement coverage percentage'
    value: ${{ steps.check.outputs.statements }}
  functions-coverage:
    description: 'Function coverage percentage'
    value: ${{ steps.check.outputs.functions }}
  branches-coverage:
    description: 'Branch coverage percentage'
    value: ${{ steps.check.outputs.branches }}

runs:
  using: 'composite'
  steps:
    - name: Check coverage threshold
      id: check
      shell: bash
      run: |
        COVERAGE_FILE="${{ inputs.coverage-file }}"
        THRESHOLD="${{ inputs.threshold }}"
        PACKAGE_NAME="${{ inputs.package-name }}"

        if [ ! -f "$COVERAGE_FILE" ]; then
          echo "❌ Coverage file not found: $COVERAGE_FILE"
          exit 1
        fi

        echo "📊 Checking coverage threshold for $PACKAGE_NAME"
        echo "Required threshold: ${THRESHOLD}%"
        echo ""

        # Use Node.js to parse coverage and check thresholds
        node <<'EOF'
        const fs = require('fs');

        const coverageFile = process.env.COVERAGE_FILE;
        const threshold = parseFloat(process.env.THRESHOLD);
        const packageName = process.env.PACKAGE_NAME;
        const checkLines = process.env.CHECK_LINES === 'true';
        const checkStatements = process.env.CHECK_STATEMENTS === 'true';
        const checkFunctions = process.env.CHECK_FUNCTIONS === 'true';
        const checkBranches = process.env.CHECK_BRANCHES === 'true';
        const failOnThreshold = process.env.FAIL_ON_THRESHOLD === 'true';

        // Parse coverage file
        const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
        const total = coverage.total;

        // Extract percentages
        const lines = total.lines.pct;
        const statements = total.statements.pct;
        const functions = total.functions.pct;
        const branches = total.branches.pct;

        // Set outputs
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `lines=${lines}\n`);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `statements=${statements}\n`);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `functions=${functions}\n`);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `branches=${branches}\n`);

        // Check thresholds
        const failures = [];

        console.log('Coverage Report:');
        console.log(`  Lines:      ${lines.toFixed(2)}% ${checkLines && lines < threshold ? '❌' : '✅'}`);
        console.log(`  Statements: ${statements.toFixed(2)}% ${checkStatements && statements < threshold ? '❌' : '✅'}`);
        console.log(`  Functions:  ${functions.toFixed(2)}% ${checkFunctions && functions < threshold ? '❌' : '✅'}`);
        console.log(`  Branches:   ${branches.toFixed(2)}% ${checkBranches && branches < threshold ? '❌' : '✅'}`);
        console.log('');

        if (checkLines && lines < threshold) {
          failures.push(`Lines: ${lines.toFixed(2)}% < ${threshold}%`);
        }
        if (checkStatements && statements < threshold) {
          failures.push(`Statements: ${statements.toFixed(2)}% < ${threshold}%`);
        }
        if (checkFunctions && functions < threshold) {
          failures.push(`Functions: ${functions.toFixed(2)}% < ${threshold}%`);
        }
        if (checkBranches && branches < threshold) {
          failures.push(`Branches: ${branches.toFixed(2)}% < ${threshold}%`);
        }

        if (failures.length > 0) {
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'passed=false\n');
          console.log(`❌ Coverage threshold not met for ${packageName}:`);
          failures.forEach(f => console.log(`   ${f}`));
          console.log('');
          console.log(`Required: ${threshold}% for all metrics`);

          if (failOnThreshold) {
            process.exit(1);
          }
        } else {
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'passed=true\n');
          console.log(`✅ All coverage thresholds met for ${packageName} (>= ${threshold}%)`);
        }
        EOF
      env:
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        THRESHOLD: ${{ inputs.threshold }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        CHECK_LINES: ${{ inputs.check-lines }}
        CHECK_STATEMENTS: ${{ inputs.check-statements }}
        CHECK_FUNCTIONS: ${{ inputs.check-functions }}
        CHECK_BRANCHES: ${{ inputs.check-branches }}
        FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}

branding:
  icon: 'shield'
  color: 'purple'
