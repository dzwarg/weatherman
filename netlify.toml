[build]
  command = "npm run build"
  publish = "packages/frontend/dist"
  functions = "packages/server/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "9"

[context.production]
  branch = "main"

[context.deploy-preview]
  branch = "!main"

[context.branch-deploy]
  branch = "{branch}"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  directory = "packages/server/netlify/functions"
  node_bundler = "esbuild"
